name: Bug
description: Something is broken or does not do what it says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste what you typed into a chat, a file of yours, or an
        address you do not want public. Nothing we need to fix a bug requires
        any of them.

        Security issues do not go here. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: os
    attributes:
      label: OS, architecture, and AInode version or commit
      placeholder: macOS 15.2, arm64, AInode 0.9.2
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Anything the app, a build or a test printed
      render: text
